[workspace]
resolver = "2"
members = [
    "crates/rover-core",
    "crates/rover-net",
    "crates/rover-ai",
    "crates/rover-browser",
]

[workspace.package]
version = "2.0.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
scrypt = "0.11"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
regex = "1.11"
aho-corasick = "1.1"
url = "2.5"
percent-encoding = "2.3"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.20"
thiserror = "2.0"
tempfile = "3.13"
bincode = "1.3"
ureq = { version = "2.10", features = ["json"] }
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
